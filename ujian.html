<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulangan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
body { font-family: sans-serif; margin: 0; background: #F1F5F9; padding: 16px; }
.card { background: white; border-radius: 16px; padding: 16px; max-width: 500px; margin: 0 auto; }
.btn { width: 100%; background: #0F172A; color: white; padding: 14px; border: none; border-radius: 999px; font-weight: 800; margin-top: 12px; }
.pilihan { display: block; background: #F8FAFC; border: 1px solid #E2E8F0; padding: 12px; border-radius: 12px; margin-top: 8px; }
#peringatan { display: none; background: #FECACA; color: #991B1B; padding: 12px; border-radius: 12px; text-align: center; font-weight: 800; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card">
<h2>Ulangan Matematika</h2>
<p>Nama: <input id="nama" placeholder="Isi nama kamu" style="width:100%; padding:10px; border-radius:10px; border:1px solid #E2E8F0"></p>
<div id="peringatan"></div>
<div id="soalArea">
<p><b>1. 5 + 7 = ?</b></p>
<label class="pilihan"><input type="radio" name="soal1" value="12"> 12</label>
<label class="pilihan"><input type="radio" name="soal1" value="10"> 10</label>
<label class="pilihan"><input type="radio" name="soal1" value="13"> 13</label>
<p><b>2. Ibu kota Indonesia adalah?</b></p>
<label class="pilihan"><input type="radio" name="soal2" value="Jakarta"> Jakarta</label>
<label class="pilihan"><input type="radio" name="soal2" value="Bogor"> Bogor</label>
<label class="pilihan"><input type="radio" name="soal2" value="Bandung"> Bandung</label>
<p><b>3. 10 x 2 = ?</b></p>
<label class="pilihan"><input type="radio" name="soal3" value="20"> 20</label>
<label class="pilihan"><input type="radio" name="soal3" value="12"> 12</label>
<label class="pilihan"><input type="radio" name="soal3" value="22"> 22</label>
<p><b>4. 20 - 5 = ?</b></p>
<label class="pilihan"><input type="radio" name="soal4" value="15"> 15</label>
<label class="pilihan"><input type="radio" name="soal4" value="10"> 10</label>
<label class="pilihan"><input type="radio" name="soal4" value="25"> 25</label>
<p><b>5. Lambang bilangan lima belas adalah?</b></p>
<label class="pilihan"><input type="radio" name="soal5" value="15"> 15</label>
<label class="pilihan"><input type="radio" name="soal5" value="51"> 51</label>
<label class="pilihan"><input type="radio" name="soal5" value="5"> 5</label>
</div>
<button class="btn" onclick="mulaiUjian()">MULAI UJIAN - FULLSCREEN</button>
<button class="btn" onclick="kumpul()">KUMPULKAN JAWABAN</button>
<p id="hasil" style="text-align:center; font-weight:800"></p>
</div>
<script>
let pelanggaran = 0;
let ujianMulai = false;
let mqttClient = new 【entity-Paho¦canonical_name=Paho】.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", "murid-" + Math.floor(Math.random()*10000));
mqttClient.connect({ onSuccess: function(){ console.log("Murid tersambung!"); }, useSSL: true });
function kirimKeGuru(keterangan) {
  try {
    let nama = document.getElementById('nama').value || "Tanpa Nama";
    let pesan = nama + " | Pelanggaran ke-" + pelanggaran + " | " + keterangan + " | " + new Date().toLocaleTimeString('id-ID');
    let msg = new 【entity-Paho¦canonical_name=Paho】.MQTT.Message(pesan);
    msg.destinationName = "smarthomebogor/ujian/pelanggaran";
    mqttClient.send(msg);
  } catch(e) {}
}
function mulaiUjian() {
  if (!document.getElementById('nama').value) { alert('Isi nama dulu!'); return; }
  ujianMulai = true;
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  alert('Ujian dimulai! Jangan buka tab baru. Kalau ketahuan 3x, langsung dikumpulkan dan guru langsung tau!');
}
function cekPelanggaran(pesan) {
  let per = document.getElementById('peringatan');
  per.style.display = 'block';
  per.innerText = '⚠️ PELANGGARAN KE-' + pelanggaran + ': ' + pesan;
  alert('⚠️ PELANGGARAN KE-' + pelanggaran + '\n' + pesan + '\nLaporan ini sudah masuk ke HP Guru!');
  kirimKeGuru(pesan);
  if (pelanggaran >= 3) { alert('Sudah 3x! Ujian dikumpulkan otomatis!'); kumpul(); }
}
document.addEventListener('visibilitychange', function() {
  if (!ujianMulai) return;
  if (document.hidden) { pelanggaran++; cekPelanggaran('Pindah tab / minimize'); }
});
document.addEventListener('fullscreenchange', function() {
  if (!ujianMulai) return;
  if (!document.fullscreenElement) { pelanggaran++; cekPelanggaran('Keluar dari Fullscreen (pencet ESC)'); }
});
window.addEventListener('beforeunload', function(e) {
  if (ujianMulai) { e.preventDefault(); e.returnValue = 'Kalau keluar, dianggap pelanggaran!'; return 'Kalau keluar, dianggap pelanggaran!'; }
});
document.addEventListener('contextmenu', e => e.preventDefault());
function kumpul() {
  ujianMulai = false;
  let benar = 0;
  if (document.querySelector('input[name="soal1"]:checked')?.value == '12') benar++;
  if (document.querySelector('input[name="soal2"]:checked')?.value == 'Jakarta') benar++;
  if (document.querySelector('input[name="soal3"]:checked')?.value == '20') benar++;
  if (document.querySelector('input[name="soal4"]:checked')?.value == '15') benar++;
  if (document.querySelector('input[name="soal5"]:checked')?.value == '15') benar++;
  document.getElementById('hasil').innerText = 'Nama: ' + document.getElementById('nama').value + ' | Nilai: ' + (benar * 20) + '/100 | Pelanggaran: ' + pelanggaran + 'x';
  if (document.exitFullscreen) document.exitFullscreen();
}
</script>
</body>
</html>
