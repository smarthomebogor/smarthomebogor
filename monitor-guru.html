<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Guru</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
body { font-family: sans-serif; margin: 0; background: #0F172A; padding: 16px; color: white; }
.card { background: white; color: #0F172A; border-radius: 16px; padding: 16px; max-width: 500px; margin: 0 auto; }
.item { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 12px; padding: 12px; margin-top: 10px; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
<h2>📋 Monitor Guru</h2>
<p id="status" style="text-align:center; font-weight:800">🔴 Belum tersambung...</p>
<p style="font-size:12px; color:#64748B; text-align:center">Buka halaman ini sebelum ujian dimulai. Kalau ada murid pindah tab, langsung muncul di sini.</p>
<div id="list"></div>
<button onclick="document.getElementById('list').innerHTML=''" style="width:100%; padding:12px; border-radius:999px; border:none; background:#0F172A; color:white; font-weight:800; margin-top:12px">HAPUS SEMUA LAPORAN</button>
</div>
<script>
let client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", "guru-" + Math.floor(Math.random()*10000));
client.onMessageArrived = function(msg) {
  let div = document.createElement('div');
  div.className = 'item';
  div.innerText = '⚠️ ' + msg.payloadString;
  document.getElementById('list').prepend(div);
};
client.onConnectionLost = function(){ document.getElementById('status').innerText = '🔴 Putus, nyambung lagi...'; setTimeout(()=>client.connect({onSuccess:onConnect, useSSL:true}), 2000); };
function onConnect(){ document.getElementById('status').innerText = '🟢 Tersambung - Siap mantau!'; client.subscribe("smarthomebogor/ujian/pelanggaran"); }
client.connect({ onSuccess: onConnect, useSSL: true });
</script>
</body>
</html>
